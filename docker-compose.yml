name: smart-vms

services:
  mysql:
    image: mysql:8.4
    container_name: vms-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vms_db}
      MYSQL_USER: ${MYSQL_USER:-vms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vms-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: vms-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    networks:
      - vms-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rtsp-proxy:
    build:
      context: services/media-engine/rtsp-proxy
      dockerfile: Dockerfile
    container_name: vms-rtsp-proxy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?CREDENTIAL_KEY is required}
    networks:
      - vms-net

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vms-mediamtx
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOSTS:-127.0.0.1,localhost}
    volumes:
      - ./services/media-engine/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
      - "127.0.0.1:${MEDIAMTX_API_PORT:-9997}:9997"
    networks:
      - vms-net

  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: vms-api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?CREDENTIAL_KEY is required}
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET is required}
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_API_PORT: 9997
      MEDIAMTX_RTSP_PORT: 8554
      RAW_DIR: /data/raw
      COMPRESSED_DIR: /data/compressed
      TEMP_DIR: /data/tmp
      SNAPSHOTS_DIR: /data/snapshots
      DATA_DIR: /data
      FAST_PROFILE: ${FAST_PROFILE:-1}
      SEGMENT_SEC: ${SEGMENT_SEC:-3600}
      RAW_RETENTION_SEC: ${RAW_RETENTION_SEC:-30}
      ACTIVITY_WINDOW_SEC: ${ACTIVITY_WINDOW_SEC:-20}
      PROBE_SAMPLE_SEC: ${PROBE_SAMPLE_SEC:-10}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vms-net

  recorder:
    build:
      context: .
      dockerfile: services/media-engine/recorder/Dockerfile
    container_name: vms-recorder
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?CREDENTIAL_KEY is required}
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET is required}
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: 8554
      RAW_DIR: /data/raw
      SEGMENT_SEC: ${SEGMENT_SEC:-3600}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - vms-net

  transcode-worker:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile.worker
    image: vms-transcode-worker:latest
    container_name: vms-transcode-worker
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RAW_DIR: /data/raw
      COMPRESSED_DIR: /data/compressed
      TEMP_DIR: /data/tmp
      DATA_DIR: /data
      FAST_PROFILE: ${FAST_PROFILE:-1}
      SCHEDULER_INTERVAL_MS: 15000
      HEALTH_KEY: transcode:heartbeat
      HEALTH_MAX_AGE_MS: 90000
      DISK_HIGH_WATERMARK_PCT: ${DISK_HIGH_WATERMARK_PCT:-85}
      DISK_CRITICAL_PCT: ${DISK_CRITICAL_PCT:-95}
      RAW_RETENTION_SEC: ${RAW_RETENTION_SEC:-86400}
      ACTIVITY_WINDOW_SEC: ${ACTIVITY_WINDOW_SEC:-20}
      PROBE_SAMPLE_SEC: ${PROBE_SAMPLE_SEC:-10}
      PROBE_INTERVAL_SEC: ${PROBE_INTERVAL_SEC:-600}
      DELETE_RAW_AFTER_VERIFY: ${DELETE_RAW_AFTER_VERIFY:-false}
      RAW_DELETE_GRACE_SEC: ${RAW_DELETE_GRACE_SEC:-3600}
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vms-net

  ai-vision-worker:
    build:
      context: services/ai-vision-worker
      dockerfile: Dockerfile
    container_name: vms-ai-vision-worker
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MEDIAMTX_AUTH_SECRET: ${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET is required}
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: 8554
      MODEL_PATH: /app/yolov8n.pt
      AI_FPS: 10
      ACTIVITY_WINDOW_SEC: ${ACTIVITY_WINDOW_SEC:-20}
      PROBE_SAMPLE_SEC: ${PROBE_SAMPLE_SEC:-10}
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vms-net

  web-dashboard:
    build:
      context: apps/web-dashboard
      dockerfile: Dockerfile
    container_name: vms-web-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - vms-net

networks:
  vms-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
