[project]
name = "vms-ai-vision-worker"
version = "1.0.0"
description = "AI Vision Worker for Smart VMS (YOLO26n + TensorRT)"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.0",
    "av>=19.0.0",
    "redis>=8.0.0",
    "pymysql>=1.2.0",
    "pynvml>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
