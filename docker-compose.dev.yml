services:
  mysql:
    ports:
      - "127.0.0.1:3306:3306"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  rtsp-proxy:
    environment:
      NODE_ENV: development
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?CREDENTIAL_KEY is required}
    volumes:
      - ./services/media-engine/rtsp-proxy/proxy.py:/app/proxy.py:ro

  mediamtx:
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOSTS:-127.0.0.1,localhost}

  api-server:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ACTIVITY_WINDOW_SEC: ${ACTIVITY_WINDOW_SEC:-20}
      PROBE_SAMPLE_SEC: ${PROBE_SAMPLE_SEC:-10}
    volumes:
      - ./apps/api-server/dist:/app/apps/api-server/dist:ro

  recorder:
    volumes:
      - ./services/media-engine/recorder/dist:/app/services/media-engine/recorder/dist:ro

  transcode-worker:
    environment:
      ACTIVITY_WINDOW_SEC: ${ACTIVITY_WINDOW_SEC:-20}
      PROBE_SAMPLE_SEC: ${PROBE_SAMPLE_SEC:-10}
    volumes:
      - ./apps/api-server/dist:/app/apps/api-server/dist:ro

  ai-vision-worker:
    environment:
      ACTIVITY_WINDOW_SEC: ${ACTIVITY_WINDOW_SEC:-20}
      PROBE_SAMPLE_SEC: ${PROBE_SAMPLE_SEC:-10}
    volumes:
      - ./services/ai-vision-worker/src:/app/src:ro

  web-dashboard:
    volumes:
      - ./apps/web-dashboard/dist:/usr/share/nginx/html:ro
      - ./apps/web-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  sim-cam-1:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: vms-sim-cam-1
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
      api-server:
        condition: service_healthy
    command: >
      -re -f lavfi -i testsrc=size=1920x1080:rate=25
      -vf "drawtext=text='CAM1 %{localtime}':fontsize=36:fontcolor=white:x=40:y=40:box=1:boxcolor=black@0.6"
      -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2M -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://internal_publisher:${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET is required}@mediamtx:8554/cam1
    networks:
      - vms-net

  sim-cam-2:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: vms-sim-cam-2
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
      api-server:
        condition: service_healthy
    command: >
      -re -f lavfi -i testsrc2=size=1920x1080:rate=25
      -vf "drawtext=text='CAM2 %{localtime}':fontsize=36:fontcolor=white:x=40:y=40:box=1:boxcolor=black@0.6"
      -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2M -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://internal_publisher:${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET is required}@mediamtx:8554/cam2
    networks:
      - vms-net

  sim-cam-3:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: vms-sim-cam-3
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
      api-server:
        condition: service_healthy
    command: >
      -re -f lavfi -i smptebars=size=1920x1080:rate=25
      -vf "drawtext=text='CAM3 %{localtime}':fontsize=36:fontcolor=white:x=40:y=40:box=1:boxcolor=black@0.6"
      -c:v libx264 -preset ultrafast -tune zerolatency -b:v 2M -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://internal_publisher:${MEDIAMTX_AUTH_SECRET:?MEDIAMTX_AUTH_SECRET is required}@mediamtx:8554/cam3
    networks:
      - vms-net
